[package]
name = "yarok-launcher"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.30"
egui = "0.30"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true