[package]
name = "yarok-launcher"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true