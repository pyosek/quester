name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: 'v1.0.1'
      prerelease:
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Validate tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Invalid tag '$env:TAG'"
          }

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ github.event.repository.name }}
        run: |
          $exes = Get-ChildItem -Path "target/release/*.exe"
          if ($exes.Count -eq 0) { throw "No exe files found" }

          $pkg = "pkg/$env:NAME"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item $exes.FullName -Destination $pkg

          $zip = "dist/$env:NAME-$env:TAG.zip"
          Compress-Archive -Path $pkg -DestinationPath $zip -Force

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
