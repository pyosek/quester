name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: 'v1.2.1'
      prerelease:
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid tag '$TAG'" >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: cargo build --release

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ github.event.repository.name }}
        run: |
          $exes = Get-ChildItem -Path "target/release/*.exe"
          if ($exes.Count -eq 0) { throw "No exe files found" }

          $pkg = "pkg/$env:NAME"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item $exes.FullName -Destination $pkg

          $zip = "dist/$env:NAME-$env:TAG-windows.zip"
          Compress-Archive -Path $pkg -DestinationPath $zip -Force

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p "pkg/$NAME" dist
          install -Dm755 target/release/quester "pkg/$NAME/quester"
          tar -C pkg -czf "dist/$NAME-$TAG-linux.tar.gz" "$NAME"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: quester-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
