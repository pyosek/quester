name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match version in Cargo.toml, e.g. v1.2.1)'
        required: true
        default: 'v1.2.1'
      prerelease:
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid tag '$TAG'" >&2
            exit 1
          fi
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "v$CARGO_VER" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $CARGO_VER." >&2
            echo "The in-app update check compares them, so bump Cargo.toml first." >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: cargo build --release

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          NAME: ${{ github.event.repository.name }}
        run: |
          $pkg = "pkg/$env:NAME"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/quester.exe" -Destination $pkg
          Compress-Archive -Path $pkg -DestinationPath "dist/$env:NAME-$env:TAG-windows.zip" -Force

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        env:
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p "pkg/$NAME" dist
          install -Dm755 target/release/quester "pkg/$NAME/quester"
          tar -C pkg -czf "dist/$NAME-$TAG-linux.tar.gz" "$NAME"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: quester-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
